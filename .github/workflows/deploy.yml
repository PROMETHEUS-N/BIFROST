            $n="bifrost-vm-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([guid]::NewGuid().ToString('N').Substring(0,6))"
            az deployment group what-if --name $n --resource-group $x.resourceGroupName --template-file modules/compute/vm.bicep --parameters "@$f";if($LASTEXITCODE -ne 0){throw 'VM What-If failed.'}
            az deployment group create --name $n --resource-group $x.resourceGroupName --template-file modules/compute/vm.bicep --parameters "@$f" --output none;if($LASTEXITCODE -ne 0){throw 'VM deployment failed.'}
            $status='DEPLOYED';$reason='What-If and deployment succeeded.'
          }catch{$reason=$_.Exception.Message;Write-Error $reason -ErrorAction Continue}
