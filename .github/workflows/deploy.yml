name: ❄️ BIFROST | Resilient Infrastructure Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  prechecks:
    name: 🧪 Validate deployment input
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate input.json and required configuration
        shell: pwsh
        env:
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content 'input.json' -Raw | ConvertFrom-Json
          if ([string]$cfg.environment -ne 'dev') { throw "Expected root environment 'dev'." }
          $requiredArrays = @('resourceGroups','vnets','subnets','nsgs','routeTables','vms','keyVaults','storageAccounts','sqlDatabases','openAiServices')
          foreach ($name in $requiredArrays) {
            if ($null -eq $cfg.landingZones.$name) { throw "landingZones.$name is missing from input.json." }
          }
          if (@($cfg.landingZones.resourceGroups).Count -eq 0) { throw 'At least one resource group must be requested.' }
          foreach ($secretName in @('VM_ADMIN_PASSWORD','SQL_ADMIN_PASSWORD','AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($secretName))) {
              throw "Required GitHub secret $secretName is missing."
            }
          }
          if ($env:AZURE_SUBSCRIPTION_ID -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') {
            throw 'AZURE_SUBSCRIPTION_ID must be a GUID.'
          }
          Write-Host 'input.json structure and required secrets are valid.'

  azure-login-check:
    name: 🔐 Azure OIDC authentication
    runs-on: [self-hosted, X64, Windows]
    needs: prechecks
    if: ${{ needs.prechecks.result == 'success' }}
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Azure login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify selected subscription
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          az account set --subscription $env:AZURE_SUBSCRIPTION_ID
          if ($LASTEXITCODE -ne 0) { throw 'Could not select the configured subscription.' }
          az account show --query '{name:name,id:id,tenantId:tenantId}' --output json
          if ($LASTEXITCODE -ne 0) { throw 'Azure subscription verification failed.' }

  deploy-and-report:
    name: 🚀 Deploy resources and publish report
    runs-on: [self-hosted, X64, Windows]
    needs: [prechecks, azure-login-check]
    if: ${{ always() }}
    environment: dev
    env:
      PRECHECK_OUTCOME: ${{ needs.prechecks.result }}
      AZURE_LOGIN_OUTCOME: ${{ needs.azure-login-check.result }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
      SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Re-authenticate to Azure on the deployment runner
        id: azure-login
        if: ${{ needs.prechecks.result == 'success' && needs.azure-login-check.result == 'success' }}
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run fault-tolerant resource deployment
        id: deployment
        shell: pwsh
        continue-on-error: true
        env:
          PRECHECK_OUTCOME: ${{ needs.prechecks.result }}
          AZURE_LOGIN_OUTCOME: ${{ steps.azure-login.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/deploy.ps1
      - name: Upload complete deployment report
        id: upload-report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-deployment-report
          path: |
            artifacts/deployment-report.csv
            artifacts/deployment-report.json
            artifacts/deployment-report.md
          if-no-files-found: error
          retention-days: 90
      - name: Mark run failed when resources failed or were skipped
        if: ${{ always() && steps.upload-report.outcome == 'success' }}
        shell: pwsh
        run: |
          $report = Import-Csv 'artifacts/deployment-report.csv'
          $failed = @($report | Where-Object Status -eq 'FAILED')
          $skipped = @($report | Where-Object Status -eq 'SKIPPED')
          Write-Host "Deployed: $(@($report | Where-Object Status -eq 'DEPLOYED').Count)"
          Write-Host "Failed: $($failed.Count)"
          Write-Host "Skipped: $($skipped.Count)"
          if ($failed.Count -gt 0 -or $skipped.Count -gt 0) {
            Write-Error "Deployment finished with $($failed.Count) failed and $($skipped.Count) skipped resource(s). Download bifrost-deployment-report for details."
          }
