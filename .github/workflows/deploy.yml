name: ❄️ BIFROST | Matrix Infrastructure Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # 🧪 Build one matrix per resource type from the objects actually present in input.json.
  prepare:
    name: 🧪 Validate input and prepare matrices
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      resource_groups: ${ steps.matrices.outputs.resource_groups }
      nsgs: ${ steps.matrices.outputs.nsgs }
      route_tables: ${ steps.matrices.outputs.route_tables }
      vnets: ${ steps.matrices.outputs.vnets }
      subnets: ${ steps.matrices.outputs.subnets }
      key_vaults: ${ steps.matrices.outputs.key_vaults }
      storage_accounts: ${ steps.matrices.outputs.storage_accounts }
      sql_databases: ${ steps.matrices.outputs.sql_databases }
      openai_services: ${ steps.matrices.outputs.openai_services }
      vms: ${ steps.matrices.outputs.vms }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate input.json and prepare resource matrices
        id: matrices
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          VM_ADMIN_PASSWORD: ${{ secrets.VM_ADMIN_PASSWORD }}
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content 'input.json' -Raw | ConvertFrom-Json
          if ([string]$cfg.environment -ne 'dev') { throw "Expected root environment 'dev'." }

          foreach ($secretName in @('AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($secretName))) {
              throw "Required GitHub environment secret $secretName is missing."
            }
          }
          if ($env:AZURE_SUBSCRIPTION_ID -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$') {
            throw 'AZURE_SUBSCRIPTION_ID must be a GUID.'
          }

          $definitions = @(
            @{ Key='resourceGroups'; Output='resource_groups'; Name='rgName' },
            @{ Key='nsgs'; Output='nsgs'; Name='name' },
            @{ Key='routeTables'; Output='route_tables'; Name='name' },
            @{ Key='vnets'; Output='vnets'; Name='name' },
            @{ Key='subnets'; Output='subnets'; Name='name' },
            @{ Key='keyVaults'; Output='key_vaults'; Name='name' },
            @{ Key='storageAccounts'; Output='storage_accounts'; Name='name' },
            @{ Key='sqlDatabases'; Output='sql_databases'; Name='databaseName' },
            @{ Key='openAiServices'; Output='openai_services'; Name='name' },
            @{ Key='vms'; Output='vms'; Name='name' }
          )

          foreach ($definition in $definitions) {
            $items = @($cfg.landingZones.($definition.Key))
            if ($null -eq $cfg.landingZones.($definition.Key)) { $items = @() }

            if ($definition.Key -eq 'resourceGroups' -and $items.Count -eq 0) {
              throw 'At least one resource group must be requested.'
            }
            if ($definition.Key -eq 'vms' -and $items.Count -gt 0 -and [string]::IsNullOrWhiteSpace($env:VM_ADMIN_PASSWORD)) {
              throw 'VM_ADMIN_PASSWORD is required because input.json requests one or more VMs.'
            }
            if ($definition.Key -eq 'sqlDatabases' -and $items.Count -gt 0 -and [string]::IsNullOrWhiteSpace($env:SQL_ADMIN_PASSWORD)) {
              throw 'SQL_ADMIN_PASSWORD is required because input.json requests one or more SQL databases.'
            }

            $include = @()
            for ($index = 0; $index -lt $items.Count; $index++) {
              $itemJson = ConvertTo-Json -InputObject $items[$index] -Depth 100 -Compress
              $resourceName = [string]$items[$index].($definition.Name)
              if ([string]::IsNullOrWhiteSpace($resourceName)) { throw "A resource in landingZones.$($definition.Key) is missing '$($definition.Name)'." }
              $include += @{
                item = $itemJson
                resourceName = $resourceName
                artifact = "$($definition.Output)-$index"
                skip = $false
              }
            }

            # GitHub Actions does not accept an empty matrix. A single no-op entry represents an empty resource array.
            if ($include.Count -eq 0) {
              $include = @(@{ item='{}'; resourceName='No resources requested'; artifact="$($definition.Output)-empty"; skip=$true })
            }

            $matrixJson = ConvertTo-Json -InputObject @{ include = $include } -Depth 100 -Compress
            " $($definition.Output)=$matrixJson".Trim() | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "$($definition.Key): $($items.Count) requested resource(s)."
          }

  # 🔐 Resource Group stage. Every matrix instance gets its own runner and Azure OIDC session.
  deploy-resource-groups:
    name: 🏗️ Resource Group / ${{ matrix.resourceName }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.resource_groups) }}
    steps:
      - name: Checkout repository
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
      - name: Install Azure CLI
        if: ${{ !matrix.skip }}
        shell: bash
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login using OIDC
        if: ${{ !matrix.skip }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Resource Group
        if: ${{ !matrix.skip }}
        id: deploy
        continue-on-error: true
        shell: pwsh
        env:
          RESOURCE_JSON: ${{ matrix.item }}
          RESOURCE_NAME: ${{ matrix.resourceName }}
          ARTIFACT_KEY: ${{ matrix.artifact }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          DEPLOYMENT_KIND: resourceGroups
        run: |
                    $ErrorActionPreference = 'Stop'
          $x = $env:RESOURCE_JSON | ConvertFrom-Json
          $status = 'FAILED'; $reason = ''
          try {
            $params = @{ rgname=$x.rgName; location=$x.location; tags=$x.tags }
            $file = Join-Path $env:RUNNER_TEMP 'parameters.json'
            @{ '$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#'; contentVersion='1.0.0.0'; parameters=@{} } | ConvertTo-Json -Depth 100 | Set-Content $file
            $doc = Get-Content $file -Raw | ConvertFrom-Json -AsHashtable
            foreach ($k in $params.Keys) { $doc.parameters[$k] = @{ value=$params[$k] } }
            $doc | ConvertTo-Json -Depth 100 | Set-Content $file
            $name = "bifrost-rg-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([guid]::NewGuid().ToString('N').Substring(0,6))"
            az deployment sub what-if --name $name --location $x.location --template-file modules/RG/resourcegroup.bicep --parameters "@$file"
            if ($LASTEXITCODE -ne 0) { throw 'Resource Group What-If failed.' }
            az deployment sub create --name $name --location $x.location --template-file modules/RG/resourcegroup.bicep --parameters "@$file" --output none
            if ($LASTEXITCODE -ne 0) { throw 'Resource Group deployment failed.' }
            $status='DEPLOYED'; $reason='Subscription-scope What-If and deployment succeeded.'
          } catch { $reason=$_.Exception.Message; Write-Error $reason -ErrorAction Continue }
          $row = [pscustomobject]@{ ResourceType='Resource Group'; ResourceName=$env:RESOURCE_NAME; ResourceGroup=''; Status=$status; Reason=$reason; DeploymentStage='deploy-resource-groups'; TimestampUtc=(Get-Date).ToUniversalTime().ToString('o') }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $row | ConvertTo-Json -Depth 20 | Set-Content artifacts/result.json
          if ($status -eq 'FAILED') { exit 1 }
      - name: Upload resource result
        if: ${{ always() && !matrix.skip }}
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-result-${{ matrix.artifact }}
          path: artifacts/result.json
          if-no-files-found: error
      - name: Skip empty matrix placeholder
        if: ${{ matrix.skip }}
        run: echo "No resource groups requested; no deployment performed."

  # 🌐 NSGs follow Resource Groups.
  deploy-nsgs:
    name: 🛡️ NSG / ${{ matrix.resourceName }}
    needs: [prepare, deploy-resource-groups]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.nsgs) }}
    steps:
      - name: Checkout repository
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
      - name: Install Azure CLI
        if: ${{ !matrix.skip }}
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
        shell: bash
      - name: Azure login using OIDC
        if: ${{ !matrix.skip }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy NSG
        if: ${{ !matrix.skip }}
        continue-on-error: true
        shell: pwsh
        env:
          RESOURCE_JSON: ${{ matrix.item }}
          RESOURCE_NAME: ${{ matrix.resourceName }}
          ARTIFACT_KEY: ${{ matrix.artifact }}
        run: |
          $ErrorActionPreference='Stop'; $x=$env:RESOURCE_JSON | ConvertFrom-Json
          $status='FAILED'; $reason=''
          try {
            if (-not (az group exists --name $x.resourceGroupName | ConvertFrom-Json)) { throw "Resource group '$($x.resourceGroupName)' is unavailable." }
            $p=@{ location=$x.location; nsgName=$x.name; securityRules=@($x.securityRules); tags=$x.tags }
            $f=Join-Path $env:RUNNER_TEMP 'parameters.json'
            $d=@{ '$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#'; contentVersion='1.0.0.0'; parameters=@{} }
            foreach($k in $p.Keys){$d.parameters[$k]=@{value=$p[$k]}}
            $d | ConvertTo-Json -Depth 100 | Set-Content $f
            $n="bifrost-nsg-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([guid]::NewGuid().ToString('N').Substring(0,6))"
            az deployment group what-if --name $n --resource-group $x.resourceGroupName --template-file modules/networking/nsg.bicep --parameters "@$f"
            if($LASTEXITCODE -ne 0){throw 'NSG What-If failed.'}
            az deployment group create --name $n --resource-group $x.resourceGroupName --template-file modules/networking/nsg.bicep --parameters "@$f" --output none
            if($LASTEXITCODE -ne 0){throw 'NSG deployment failed.'}
            $status='DEPLOYED';$reason='What-If and deployment succeeded.'
          } catch {$reason=$_.Exception.Message;Write-Error $reason -ErrorAction Continue}
          New-Item -ItemType Directory -Force artifacts | Out-Null
          [pscustomobject]@{ResourceType='Network Security Group';ResourceName=$env:RESOURCE_NAME;ResourceGroup=$x.resourceGroupName;Status=$status;Reason=$reason;DeploymentStage='deploy-nsgs';TimestampUtc=(Get-Date).ToUniversalTime().ToString('o')} | ConvertTo-Json -Depth 20 | Set-Content artifacts/result.json
          if($status -eq 'FAILED'){exit 1}
      - name: Upload resource result
        if: ${{ always() && !matrix.skip }}
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-result-${{ matrix.artifact }}
          path: artifacts/result.json
          if-no-files-found: error
      - name: Skip empty matrix placeholder
        if: ${{ matrix.skip }}
        run: echo "No NSGs requested."

  # 🛣️ Route Tables follow NSGs.
  deploy-route-tables:
    name: 🛣️ Route Table / ${{ matrix.resourceName }}
    needs: [prepare, deploy-nsgs]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.route_tables) }}
    steps:
      - name: Checkout repository
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
      - name: Install Azure CLI
        if: ${{ !matrix.skip }}
        shell: bash
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login using OIDC
        if: ${{ !matrix.skip }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Route Table
        if: ${{ !matrix.skip }}
        continue-on-error: true
        shell: pwsh
        env:
          RESOURCE_JSON: ${{ matrix.item }}
          RESOURCE_NAME: ${{ matrix.resourceName }}
        run: |
          $ErrorActionPreference='Stop';$x=$env:RESOURCE_JSON|ConvertFrom-Json;$status='FAILED';$reason=''
          try {
            if((az group exists --name $x.resourceGroupName | ConvertFrom-Json) -ne $true){throw "Resource group '$($x.resourceGroupName)' is unavailable."}
            $p=@{routeTableName=$x.name;location=$x.location;disableBgpRoutePropagation=$x.disableBgpRoutePropagation;routes=@($x.routes);tags=$x.tags}
            $f=Join-Path $env:RUNNER_TEMP 'parameters.json';$d=@{ '$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $p.Keys){$d.parameters[$k]=@{value=$p[$k]}};$d|ConvertTo-Json -Depth 100|Set-Content $f
            $n="bifrost-rt-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([guid]::NewGuid().ToString('N').Substring(0,6))"
            az deployment group what-if --name $n --resource-group $x.resourceGroupName --template-file modules/networking/routetable.bicep --parameters "@$f";if($LASTEXITCODE -ne 0){throw 'Route Table What-If failed.'}
            az deployment group create --name $n --resource-group $x.resourceGroupName --template-file modules/networking/routetable.bicep --parameters "@$f" --output none;if($LASTEXITCODE -ne 0){throw 'Route Table deployment failed.'}
            $status='DEPLOYED';$reason='What-If and deployment succeeded.'
          }catch{$reason=$_.Exception.Message;Write-Error $reason -ErrorAction Continue}
          New-Item -ItemType Directory -Force artifacts|Out-Null
          [pscustomobject]@{ResourceType='Route Table';ResourceName=$env:RESOURCE_NAME;ResourceGroup=$x.resourceGroupName;Status=$status;Reason=$reason;DeploymentStage='deploy-route-tables';TimestampUtc=(Get-Date).ToUniversalTime().ToString('o')}|ConvertTo-Json -Depth 20|Set-Content artifacts/result.json
          if($status -eq 'FAILED'){exit 1}
      - name: Upload resource result
        if: ${{ always() && !matrix.skip }}
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-result-${{ matrix.artifact }}
          path: artifacts/result.json
          if-no-files-found: error
      - name: Skip empty matrix placeholder
        if: ${{ matrix.skip }}
        run: echo "No Route Tables requested."

  # 🌐 VNets follow route tables.
  deploy-vnets:
    name: 🌐 VNet / ${{ matrix.resourceName }}
    needs: [prepare, deploy-route-tables]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.vnets) }}
    steps:
      - name: Checkout repository
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
      - name: Install Azure CLI
        if: ${{ !matrix.skip }}
        shell: bash
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login using OIDC
        if: ${{ !matrix.skip }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy VNet
        if: ${{ !matrix.skip }}
        continue-on-error: true
        shell: pwsh
        env:
          RESOURCE_JSON: ${{ matrix.item }}
          RESOURCE_NAME: ${{ matrix.resourceName }}
        run: |
          $ErrorActionPreference='Stop';$x=$env:RESOURCE_JSON|ConvertFrom-Json;$status='FAILED';$reason=''
          try {
            if((az group exists --name $x.resourceGroupName | ConvertFrom-Json) -ne $true){throw "Resource group '$($x.resourceGroupName)' is unavailable."}
            $p=@{location=$x.location;vnetName=$x.name;addressPrefixes=@($x.addressPrefixes);tags=$x.tags;dnsServers=@($x.dnsServers);subnets=@()}
            $f=Join-Path $env:RUNNER_TEMP 'parameters.json';$d=@{ '$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $p.Keys){$d.parameters[$k]=@{value=$p[$k]}};$d|ConvertTo-Json -Depth 100|Set-Content $f
            $n="bifrost-vnet-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([guid]::NewGuid().ToString('N').Substring(0,6))"
            az deployment group what-if --name $n --resource-group $x.resourceGroupName --template-file modules/networking/vnet.bicep --parameters "@$f";if($LASTEXITCODE -ne 0){throw 'VNet What-If failed.'}
            az deployment group create --name $n --resource-group $x.resourceGroupName --template-file modules/networking/vnet.bicep --parameters "@$f" --output none;if($LASTEXITCODE -ne 0){throw 'VNet deployment failed.'}
            $status='DEPLOYED';$reason='What-If and deployment succeeded.'
          }catch{$reason=$_.Exception.Message;Write-Error $reason -ErrorAction Continue}
          New-Item -ItemType Directory -Force artifacts|Out-Null
          [pscustomobject]@{ResourceType='Virtual Network';ResourceName=$env:RESOURCE_NAME;ResourceGroup=$x.resourceGroupName;Status=$status;Reason=$reason;DeploymentStage='deploy-vnets';TimestampUtc=(Get-Date).ToUniversalTime().ToString('o')}|ConvertTo-Json -Depth 20|Set-Content artifacts/result.json
          if($status -eq 'FAILED'){exit 1}
      - name: Upload resource result
        if: ${{ always() && !matrix.skip }}
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-result-${{ matrix.artifact }}
          path: artifacts/result.json
          if-no-files-found: error
      - name: Skip empty matrix placeholder
        if: ${{ matrix.skip }}
        run: echo "No VNets requested."

  # 🧩 Subnets require their VNet and any named NSG/Route Table.
  deploy-subnets:
    name: 🧩 Subnet / ${{ matrix.resourceName }}
    needs: [prepare, deploy-vnets]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.subnets) }}
    steps:
      - name: Checkout repository
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
      - name: Install Azure CLI
        if: ${{ !matrix.skip }}
        shell: bash
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login using OIDC
        if: ${{ !matrix.skip }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Subnet
        if: ${{ !matrix.skip }}
        continue-on-error: true
        shell: pwsh
        env:
          RESOURCE_JSON: ${{ matrix.item }}
          RESOURCE_NAME: ${{ matrix.resourceName }}
        run: |
          $ErrorActionPreference='Stop';$x=$env:RESOURCE_JSON|ConvertFrom-Json;$status='FAILED';$reason=''
          try {
            if((az group exists --name $x.resourceGroupName|ConvertFrom-Json) -ne $true){throw "Resource group '$($x.resourceGroupName)' is unavailable."}
            if(-not (az network vnet show --resource-group $x.resourceGroupName --name $x.vnetName --output none 2>$null; $LASTEXITCODE -eq 0)){throw "Required VNet '$($x.vnetName)' is unavailable."}
            if($x.networkSecurityGroupName -and (az network nsg show --resource-group $x.resourceGroupName --name $x.networkSecurityGroupName --output none 2>$null; $LASTEXITCODE -ne 0)){throw "Required NSG '$($x.networkSecurityGroupName)' is unavailable."}
            if($x.routeTableName -and (az network route-table show --resource-group $x.resourceGroupName --name $x.routeTableName --output none 2>$null; $LASTEXITCODE -ne 0)){throw "Required Route Table '$($x.routeTableName)' is unavailable."}
            $p=@{vnetName=$x.vnetName;subnetName=$x.name;addressPrefix=$x.addressPrefix;networkSecurityGroupName=$x.networkSecurityGroupName;routeTableName=$x.routeTableName;serviceEndpoints=@($x.serviceEndpoints);privateEndpointNetworkPolicies=$x.privateEndpointNetworkPolicies;privateLinkServiceNetworkPolicies=$x.privateLinkServiceNetworkPolicies}
            $f=Join-Path $env:RUNNER_TEMP 'parameters.json';$d=@{ '$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $p.Keys){$d.parameters[$k]=@{value=$p[$k]}};$d|ConvertTo-Json -Depth 100|Set-Content $f
            $n="bifrost-subnet-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([guid]::NewGuid().ToString('N').Substring(0,6))"
            az deployment group what-if --name $n --resource-group $x.resourceGroupName --template-file modules/networking/subnet.bicep --parameters "@$f";if($LASTEXITCODE -ne 0){throw 'Subnet What-If failed.'}
            az deployment group create --name $n --resource-group $x.resourceGroupName --template-file modules/networking/subnet.bicep --parameters "@$f" --output none;if($LASTEXITCODE -ne 0){throw 'Subnet deployment failed.'}
            $status='DEPLOYED';$reason='What-If and deployment succeeded.'
          }catch{$reason=$_.Exception.Message;Write-Error $reason -ErrorAction Continue}
          New-Item -ItemType Directory -Force artifacts|Out-Null
          [pscustomobject]@{ResourceType='Subnet';ResourceName=$env:RESOURCE_NAME;ResourceGroup=$x.resourceGroupName;Status=$status;Reason=$reason;DeploymentStage='deploy-subnets';TimestampUtc=(Get-Date).ToUniversalTime().ToString('o')}|ConvertTo-Json -Depth 20|Set-Content artifacts/result.json
          if($status -eq 'FAILED'){exit 1}
      - name: Upload resource result
        if: ${{ always() && !matrix.skip }}
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-result-${{ matrix.artifact }}
          path: artifacts/result.json
          if-no-files-found: error
      - name: Skip empty matrix placeholder
        if: ${{ matrix.skip }}
        run: echo "No Subnets requested."

  # 🔐 Independent service stages begin after networking. They run in parallel with one another.
  deploy-key-vaults:
    name: 🔐 Key Vault / ${{ matrix.resourceName }}
    needs: [prepare, deploy-subnets]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.key_vaults) }}
    steps:
      - name: Checkout repository
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v4
      - name: Install Azure CLI
        if: ${{ !matrix.skip }}
        shell: bash
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      - name: Azure login using OIDC
        if: ${{ !matrix.skip }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Key Vault
        if: ${{ !matrix.skip }}
        continue-on-error: true
        shell: pwsh
        env:
          RESOURCE_JSON: ${{ matrix.item }}
          RESOURCE_NAME: ${{ matrix.resourceName }}
        run: |
          $ErrorActionPreference='Stop';$x=$env:RESOURCE_JSON|ConvertFrom-Json;$status='FAILED';$reason=''
          try {
            if((az group exists --name $x.resourceGroupName|ConvertFrom-Json) -ne $true){throw "Resource group '$($x.resourceGroupName)' is unavailable."}
            $tenant=(az account show --query tenantId -o tsv).Trim()
            $p=@{keyVaultName=$x.name;location=$x.location;tenantId=$tenant;skuName=$x.skuName;skuFamily=$x.skuFamily;enableRbacAuthorization=$x.enableRbacAuthorization;enablePurgeProtection=$x.enablePurgeProtection;softDeleteRetentionInDays=$x.softDeleteRetentionInDays;publicNetworkAccess=$x.publicNetworkAccess;tags=$x.tags}
            $f=Join-Path $env:RUNNER_TEMP 'parameters.json';$d=@{ '$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
            foreach($k in $p.Keys){$d.parameters[$k]=@{value=$p[$k]}};$d|ConvertTo-Json -Depth 100|Set-Content $f
            $n="bifrost-kv-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$([guid]::NewGuid().ToString('N').Substring(0,6))"
            az deployment group what-if --name $n --resource-group $x.resourceGroupName --template-file modules/security/keyvault.bicep --parameters "@$f";if($LASTEXITCODE -ne 0){throw 'Key Vault What-If failed.'}
