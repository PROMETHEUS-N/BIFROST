          [pscustomobject]@{ResourceType='Virtual Machine';ResourceName=$env:RESOURCE_NAME;ResourceGroup=$x.resourceGroupName;Status=$status;Reason=$reason;DeploymentStage='deploy-vms';TimestampUtc=(Get-Date).ToUniversalTime().ToString('o')}|ConvertTo-Json -Depth 20|Set-Content artifacts/result.json
          if($status -eq 'FAILED'){exit 1}
