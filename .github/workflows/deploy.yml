            if((az network vnet subnet show --resource-group $x.resourceGroupName --vnet-name $x.vnetName --name $x.subnetName --output none 2>$null; $LASTEXITCODE -eq 0) -ne $true){throw "Required subnet '$($x.subnetName)' is unavailable."}
            $p=@{location=$x.location;computerName=$x.computerName;vmName=$x.name;adminUsername=$x.adminUsername;vmAdminPassword=$env:VM_ADMIN_PASSWORD;vmSize=$x.vmSize;tags=$x.tags;vnetName=$x.vnetName;subnetName=$x.subnetName;nicName=$x.nicName;privateIpAllocationMethod=$x.privateIpAllocationMethod;imagePublisher=$x.imagePublisher;imageOffer=$x.imageOffer;imageSku=$x.imageSku;imageVersion=$x.imageVersion;osDiskStorageAccountType=$x.osDiskStorageAccountType;osDiskCreateOption=$x.osDiskCreateOption;osDiskSizeGB=$x.osDiskSizeGB;enableBootDiagnostics=$x.enableBootDiagnostics}
            $f=Join-Path $env:RUNNER_TEMP 'parameters.json';$d=@{ '$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#';contentVersion='1.0.0.0';parameters=@{}}
