        with:
          name: bifrost-result-${{ matrix.artifact }}
          path: artifacts/result.json
          if-no-files-found: error
      - name: Skip empty matrix placeholder
        if: ${{ matrix.skip }}
        run: echo "No VMs requested."

  # 📊 Aggregate per-resource matrix results. Missing result files become SKIPPED rows.
  report:
    name: 📊 Consolidate deployment report
    needs: [prepare, deploy-resource-groups, deploy-nsgs, deploy-route-tables, deploy-vnets, deploy-subnets, deploy-key-vaults, deploy-storage-accounts, deploy-sql-databases, deploy-openai-services, deploy-vms]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download matrix result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bifrost-result-*
          path: matrix-results
          merge-multiple: true
      - name: Build consolidated CSV, JSON and Markdown reports
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cfg=Get-Content input.json -Raw|ConvertFrom-Json
          $definitions=@(
            @{Key='resourceGroups';Type='Resource Group';Name='rgName';Stage='deploy-resource-groups'},
            @{Key='nsgs';Type='Network Security Group';Name='name';Stage='deploy-nsgs'},
            @{Key='routeTables';Type='Route Table';Name='name';Stage='deploy-route-tables'},
            @{Key='vnets';Type='Virtual Network';Name='name';Stage='deploy-vnets'},
            @{Key='subnets';Type='Subnet';Name='name';Stage='deploy-subnets'},
            @{Key='keyVaults';Type='Key Vault';Name='name';Stage='deploy-key-vaults'},
            @{Key='storageAccounts';Type='Storage Account';Name='name';Stage='deploy-storage-accounts'},
            @{Key='sqlDatabases';Type='SQL Database';Name='databaseName';Stage='deploy-sql-databases'},
            @{Key='openAiServices';Type='Azure OpenAI';Name='name';Stage='deploy-openai-services'},
            @{Key='vms';Type='Virtual Machine';Name='name';Stage='deploy-vms'}
          )
          $rows=@()
          if(Test-Path matrix-results){
            foreach($file in Get-ChildItem matrix-results -Filter '*.json' -File){
              try{$rows+=Get-Content $file.FullName -Raw|ConvertFrom-Json}catch{Write-Warning "Could not parse result file $($file.Name): $($_.Exception.Message)"}
            }
          }
          foreach($definition in $definitions){
            foreach($item in @($cfg.landingZones.($definition.Key))){
              $resourceName=[string]$item.($definition.Name)
              $found=@($rows|Where-Object{$_.ResourceType -eq $definition.Type -and $_.ResourceName -eq $resourceName -and $_.ResourceGroup -eq [string]$item.resourceGroupName}).Count -gt 0
              if(-not $found){
                $rows+= [pscustomobject]@{ResourceType=$definition.Type;ResourceName=$resourceName;ResourceGroup=[string]$item.resourceGroupName;Status='SKIPPED';Reason='No matrix result was uploaded. Inspect the corresponding stage, prerequisite, or runner logs.';DeploymentStage=$definition.Stage;TimestampUtc=(Get-Date).ToUniversalTime().ToString('o')}
              }
            }
          }
          New-Item -ItemType Directory -Force artifacts|Out-Null
          $rows|Export-Csv artifacts/deployment-report.csv -NoTypeInformation -Encoding utf8
          $rows|ConvertTo-Json -Depth 30|Set-Content artifacts/deployment-report.json
          $deployed=@($rows|Where-Object Status -eq 'DEPLOYED').Count
          $failed=@($rows|Where-Object Status -eq 'FAILED').Count
          $skipped=@($rows|Where-Object Status -eq 'SKIPPED').Count
          $lines=@('# ❄️ BIFROST Deployment Report','','| Total | Deployed | Failed | Skipped |','|---:|---:|---:|---:|',"| $($rows.Count) | $deployed | $failed | $skipped |",'','| Type | Resource | Resource group | Stage | Status | Reason |','|---|---|---|---|---|---|')
          foreach($row in $rows){$reason=([string]$row.Reason -replace '\|','\|' -replace '\r?\n',' ');$lines+="| $($row.ResourceType) | $($row.ResourceName) | $($row.ResourceGroup) | $($row.DeploymentStage) | **$($row.Status)** | $reason |"}
          $lines|Set-Content artifacts/deployment-report.md -Encoding utf8
          @('## ❄️ BIFROST deployment summary','',"| Total | Deployed | Failed | Skipped |",'|---:|---:|---:|---:|',"| $($rows.Count) | $deployed | $failed | $skipped |",'','Full CSV, JSON and Markdown reports are available in the **bifrost-deployment-report** artifact.')|Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload consolidated deployment report
        id: upload-report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bifrost-deployment-report
          path: artifacts/deployment-report.*
          if-no-files-found: error
          retention-days: 90
      - name: Fail workflow when any resource failed or was skipped
        if: ${{ always() && steps.upload-report.outcome == 'success' }}
        shell: pwsh
        run: |
          $rows=Import-Csv artifacts/deployment-report.csv
          $failed=@($rows|Where-Object Status -eq 'FAILED').Count
          $skipped=@($rows|Where-Object Status -eq 'SKIPPED').Count
          Write-Host "Deployed: $(@($rows|Where-Object Status -eq 'DEPLOYED').Count); Failed: $failed; Skipped: $skipped"
          if($failed -gt 0 -or $skipped -gt 0){throw "Deployment completed with $failed failed and $skipped skipped resource(s). Download bifrost-deployment-report."}
