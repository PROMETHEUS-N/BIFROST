
name: RBAC | Mark 1

on:
  workflow_dispatch:
    inputs:
      deploy_resources:
        description: 'Deploy after What-If preview (false = preview only)'
        type: boolean
        required: true
        default: false
      deploy_pim:
        description: 'Request PIM eligibility (requires privileged permissions)'
        type: boolean
        required: true
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: 01 - Validate JSON and build Bicep modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep
        run: |
          az bicep install
          az bicep version
      - name: Build Bicep templates
        shell: bash
        run: |
          set -euo pipefail
          for file in modules/resource-group/resource-group.bicep modules/networking/nsg.bicep modules/networking/vnet.bicep modules/networking/public-ip.bicep modules/networking/nic.bicep modules/compute/vm-linux.bicep modules/compute/vm-win.bicep modules/pim/pim.bicep modules/pim/main.bicep; do
            echo "Building $file"
            az bicep build --file "$file" --stdout >/dev/null
          done
      - name: Validate input.json
        run: jq empty input.json

  validate:
    name: 02 - Validate request and Azure environment
    needs: lint
    runs-on: ubuntu-latest
    environment: bifrost-dev
    outputs:
      subscription_id: ${{ steps.cfg.outputs.subscription_id }}
      tenant_id: ${{ steps.cfg.outputs.tenant_id }}
      location: ${{ steps.cfg.outputs.location }}
      rg_name: ${{ steps.cfg.outputs.rg_name }}
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ipaddress,json,os
          c=json.load(open('input.json',encoding='utf-8'))
          plan=c.get('deploymentPlan',{})
          def check(ok,msg):
              if not ok: raise SystemExit(msg)
          check(c['request']['approved'] is True,'Request must be approved')
          check(c['subscription']['name']=='BIFROST-SC','Only BIFROST-SC is permitted')
          check(c['subscription']['subscriptionId']=='${AZURE_SUBSCRIPTION_ID}','subscriptionId must use the environment placeholder')
          check(bool(os.getenv('AZURE_SUBSCRIPTION_ID')),'AZURE_SUBSCRIPTION_ID missing in bifrost-dev')
          check(bool(os.getenv('AZURE_TENANT_ID')),'AZURE_TENANT_ID missing in bifrost-dev')
          check(plan.get('resourceGroup')=='create','For this test, deploymentPlan.resourceGroup must be create')
          check(plan.get('networking',{}).get('nsg')=='create','NSG deployment plan must be create')
          check(plan.get('networking',{}).get('vnet')=='create','VNet deployment plan must be create')
          check(plan.get('networking',{}).get('subnet')=='create','Subnet deployment plan must be create')
          check(plan.get('networking',{}).get('publicIp')=='create','Public IP deployment plan must be create')
          check(plan.get('networking',{}).get('nic')=='create','NIC deployment plan must be create')
          check(plan.get('virtualMachine')=='create','VM deployment plan must be create')
          check(plan.get('windowsVirtualMachine')=='create','Windows VM deployment plan must be create')
          windows=[v for v in c.get('virtualMachines',[]) if v.get('osType','').lower()=='windows']
          check(len(windows)==1,'Exactly one Windows VM configuration is required for this workflow test')
          check(len(windows[0]['name'])<=64,'Windows VM resource name must be 64 characters or fewer')
          check(len(windows[0].get('computerName','BIFROSTWIN001'))<=15,'Windows computerName must be 15 characters or fewer')
          check(plan.get('pim')=='create','PIM deployment plan must be create for testing')
          check(c.get('pim',{}).get('scope',{}).get('type')=='ResourceGroup','PIM scope must be ResourceGroup for this module')
          check(c.get('pim',{}).get('scope',{}).get('resourceGroupName')==c['resourceGroup']['name'],'PIM scope resource group must match configured resource group')
          check(c['virtualMachine']['resourceGroupName']==c['resourceGroup']['name'],'VM RG and RG configuration mismatch')
          check(c['virtualMachine']['sshPublicKey'].startswith('ssh-'),'Valid SSH public key required')
          ip=ipaddress.ip_network(c['virtualMachine']['network']['sshAllowedSourceAddressPrefix'],strict=False)
          check(ip.prefixlen==ip.max_prefixlen,'SSH source must be a single host CIDR')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write(f"subscription_id={os.environ['AZURE_SUBSCRIPTION_ID']}\n")
            f.write(f"tenant_id={os.environ['AZURE_TENANT_ID']}\n")
            f.write(f"location={c['deployment']['location']}\n")
            f.write(f"rg_name={c['resourceGroup']['name']}\n")
          PY

  prepare:
    name: 03 - Prepare input.json deployment artifact
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve subscription placeholder and publish config
        env:
          AZURE_SUBSCRIPTION_ID: ${{ needs.validate.outputs.subscription_id }}
        run: |
          jq --arg sid "$AZURE_SUBSCRIPTION_ID" '.subscription.subscriptionId=$sid' input.json > input.resolved.json
      - uses: actions/upload-artifact@v4
        with:
          name: bifrost-input-config
          path: input.resolved.json
          retention-days: 1

  what-if:
    name: 04 - Subscription What-If preview
    needs: [validate,prepare]
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Generate RG module parameters
        run: |
          jq '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",contentVersion:"1.0.0.0",parameters:{name:{value:.resourceGroup.name},location:{value:.resourceGroup.location},tags:{value:.resourceGroup.tags}}}' input.resolved.json > rg.parameters.json
      - name: Resource Group What-If
        run: az deployment sub what-if --name "BIFROST-RG-WhatIf-${{ github.run_number }}" --location "${{ needs.validate.outputs.location }}" --template-file modules/resource-group/resource-group.bicep --parameters @rg.parameters.json

  resource-group:
    name: 05 - Resource Group | Create
    needs: [validate,prepare,what-if]
    if: inputs.deploy_resources == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Resource Group module deployment
        run: |
          jq '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",contentVersion:"1.0.0.0",parameters:{name:{value:.resourceGroup.name},location:{value:.resourceGroup.location},tags:{value:.resourceGroup.tags}}}' input.resolved.json > params.json
          az deployment sub create --name "BIFROST-RG-${{ github.run_number }}" --location "${{ needs.validate.outputs.location }}" --template-file modules/resource-group/resource-group.bicep --parameters @params.json --output table

  nsg:
    name: 06 - Network Security Group | Create
    needs: [resource-group,validate]
    if: inputs.deploy_resources == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Deploy NSG Bicep module
        run: |
          jq '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",contentVersion:"1.0.0.0",parameters:{location:{value:.deployment.location},nsgName:{value:.virtualMachine.network.networkSecurityGroupName},securityRules:{value:.virtualMachine.network.securityRules},tags:{value:(.resourceGroup.tags + .virtualMachine.tags)}}}' input.resolved.json > params.json
          az deployment group create --name "BIFROST-NSG-${{ github.run_number }}" --resource-group "${{ needs.validate.outputs.rg_name }}" --template-file modules/networking/nsg.bicep --parameters @params.json --output table

  vnet:
    name: 07 - Virtual Network and Subnet | Create
    needs: [nsg,validate]
    if: inputs.deploy_resources == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Deploy VNet Bicep module
        run: |
          jq '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",contentVersion:"1.0.0.0",parameters:{location:{value:.deployment.location},vnetName:{value:.virtualMachine.network.virtualNetworkName},addressPrefixes:{value:[.virtualMachine.network.addressPrefix]},subnets:{value:[{name:.virtualMachine.network.subnetName,addressPrefix:.virtualMachine.network.subnetPrefix,nsgName:.virtualMachine.network.networkSecurityGroupName}]},tags:{value:(.resourceGroup.tags + .virtualMachine.tags)}}}' input.resolved.json > params.json
          az deployment group create --name "BIFROST-VNET-${{ github.run_number }}" --resource-group "${{ needs.validate.outputs.rg_name }}" --template-file modules/networking/vnet.bicep --parameters @params.json --output table

  public-ip:
    name: 08 - Public IP | Create
    needs: [vnet,validate]
    if: inputs.deploy_resources == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Deploy Public IP module
        run: |
          jq '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",contentVersion:"1.0.0.0",parameters:{location:{value:.virtualMachine.location},publicIpName:{value:.virtualMachine.network.publicIp.name},allocationMethod:{value:.virtualMachine.network.publicIp.allocationMethod},sku:{value:.virtualMachine.network.publicIp.sku},tags:{value:(.resourceGroup.tags + .virtualMachine.tags)}}}' input.resolved.json > params.json
          az deployment group create --name "BIFROST-PIP-${{ github.run_number }}" --resource-group "${{ needs.validate.outputs.rg_name }}" --template-file modules/networking/public-ip.bicep --parameters @params.json --output table

  nic:
    name: 09 - Network Interface | Create and attach
    needs: [public-ip,validate]
    if: inputs.deploy_resources == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Deploy NIC module and attach subnet/Public IP
        run: |
          jq '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",contentVersion:"1.0.0.0",parameters:{location:{value:.virtualMachine.location},nicName:{value:.virtualMachine.network.networkInterfaceName},vnetName:{value:.virtualMachine.network.virtualNetworkName},subnetName:{value:.virtualMachine.network.subnetName},publicIpName:{value:.virtualMachine.network.publicIp.name},attachPublicIp:{value:.virtualMachine.network.publicIp.create},tags:{value:(.resourceGroup.tags + .virtualMachine.tags)}}}' input.resolved.json > params.json
          az deployment group create --name "BIFROST-NIC-${{ github.run_number }}" --resource-group "${{ needs.validate.outputs.rg_name }}" --template-file modules/networking/nic.bicep --parameters @params.json --output table

  vm:
    name: 10 - Linux Virtual Machine | Create and attach
    needs: [nic,validate]
    if: inputs.deploy_resources == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Deploy Linux VM module
        run: |
          jq '{"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",contentVersion:"1.0.0.0",parameters:{location:{value:.virtualMachine.location},vmName:{value:.virtualMachine.name},adminUsername:{value:.virtualMachine.adminUsername},vmSize:{value:.virtualMachine.vmSize},sshPublicKey:{value:.virtualMachine.sshPublicKey},image:{value:.virtualMachine.image},osDisk:{value:.virtualMachine.osDisk},networkInterfaceName:{value:.virtualMachine.network.networkInterfaceName},tags:{value:(.resourceGroup.tags + .virtualMachine.tags)}}}' input.resolved.json > params.json
          az deployment group create --name "BIFROST-VM-${{ github.run_number }}" --resource-group "${{ needs.validate.outputs.rg_name }}" --template-file modules/compute/vm-linux.bicep --parameters @params.json --output table

  windows-public-ip:
    name: 11 - Windows VM Public IP | Create
    needs: [vnet,validate]
    if: inputs.deploy_resources == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Deploy Windows Public IP module
        run: |
          jq '[.virtualMachines[] | select(.osType=="Windows")][0] as $w | {"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",contentVersion:"1.0.0.0",parameters:{location:{value:$w.location},publicIpName:{value:$w.network.publicIp.name},allocationMethod:{value:$w.network.publicIp.allocationMethod},sku:{value:$w.network.publicIp.sku},tags:{value:(.resourceGroup.tags + $w.tags)}}}' input.resolved.json > params.json
          az deployment group create --name "BIFROST-WIN-PIP-${{ github.run_number }}" --resource-group "${{ needs.validate.outputs.rg_name }}" --template-file modules/networking/public-ip.bicep --parameters @params.json --output table

  windows-nic:
    name: 12 - Windows VM Network Interface | Create and attach
    needs: [windows-public-ip,vnet,validate]
    if: inputs.deploy_resources == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Deploy Windows NIC module and attach subnet/Public IP
        run: |
          jq '[.virtualMachines[] | select(.osType=="Windows")][0] as $w | {"$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",contentVersion:"1.0.0.0",parameters:{location:{value:$w.location},nicName:{value:$w.network.networkInterfaceName},vnetName:{value:$w.network.virtualNetworkName},subnetName:{value:$w.network.subnetName},publicIpName:{value:$w.network.publicIp.name},attachPublicIp:{value:$w.network.publicIp.create},tags:{value:(.resourceGroup.tags + $w.tags)}}}' input.resolved.json > params.json
          az deployment group create --name "BIFROST-WIN-NIC-${{ github.run_number }}" --resource-group "${{ needs.validate.outputs.rg_name }}" --template-file modules/networking/nic.bicep --parameters @params.json --output table

  windows-vm:
    name: 13 - Windows Virtual Machine | Create and attach
    needs: [windows-nic,validate]
    if: inputs.deploy_resources == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Generate secure Windows VM parameters
        env:
          WINDOWS_VM_ADMIN_PASSWORD: ${{ secrets.WINDOWS_VM_ADMIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          c=json.load(open('input.resolved.json',encoding='utf-8'))
          w=next(v for v in c['virtualMachines'] if v.get('osType','').lower()=='windows')
          password=os.environ.get('WINDOWS_VM_ADMIN_PASSWORD','')
          if not password:
              raise SystemExit('WINDOWS_VM_ADMIN_PASSWORD secret is missing in GitHub Environment bifrost-dev.')
          if len(password)<12:
              raise SystemExit('Windows VM password must be at least 12 characters.')
          params={
            "$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion":"1.0.0.0",
            "parameters":{
              "location":{"value":w["location"]},
              "vmName":{"value":w["name"]},
              "computerName":{"value":w.get("computerName","BIFROSTWIN001")},
              "adminUsername":{"value":w["adminUsername"]},
              "adminPassword":{"value":password},
              "vmSize":{"value":w["vmSize"]},
              "image":{"value":w["image"]},
              "osDisk":{"value":w["osDisk"]},
              "networkInterfaceId":{"value":f"/subscriptions/{c['subscription']['subscriptionId']}/resourceGroups/{w['resourceGroupName']}/providers/Microsoft.Network/networkInterfaces/{w['network']['networkInterfaceName']}"},
              "tags":{"value":c["resourceGroup"]["tags"] | w.get("tags",{})}
            }
          }
          json.dump(params,open('windows-vm.parameters.json','w'),indent=2)
          PY
      - name: Deploy Windows VM Bicep module
        run: |
          az deployment group create --name "BIFROST-WIN-VM-${{ github.run_number }}" --resource-group "${{ needs.validate.outputs.rg_name }}" --template-file modules/compute/vm-win.bicep --parameters @windows-vm.parameters.json --output table

  pim:
    name: 14 - PIM Eligibility | Optional
    needs: [vm,validate]
    if: inputs.deploy_resources == true && inputs.deploy_pim == true
    runs-on: ubuntu-latest
    environment: bifrost-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bifrost-input-config
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ needs.validate.outputs.tenant_id }}
          subscription-id: ${{ needs.validate.outputs.subscription_id }}
      - name: Generate PIM deployment parameters
        shell: bash
        run: |
          python - <<'PY'
          import json, uuid
          c=json.load(open('input.resolved.json',encoding='utf-8'))
          sub=c['subscription']['subscriptionId']
          role=c['pim']['role']['roleDefinitionId']
          request=str(uuid.uuid5(uuid.NAMESPACE_URL, sub+c['pim']['principal']['principalId']+role+c['request']['ticketId']))
          data={
            "$schema":"https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#",
            "contentVersion":"1.0.0.0",
            "parameters":{
              "principalId":{"value":c['pim']['principal']['principalId']},
              "roleDefinitionId":{"value":f"/subscriptions/{sub}/providers/Microsoft.Authorization/roleDefinitions/{role}"},
              "justification":{"value":c['pim']['justification']},
              "ticketNumber":{"value":c['pim']['ticketInfo']['ticketNumber']},
              "ticketSystem":{"value":c['pim']['ticketInfo']['ticketSystem']},
              "duration":{"value":c['pim']['schedule']['duration']},
              "requestName":{"value":request}
            }
          }
          json.dump(data,open('params.json','w'),indent=2)
          PY
      - name: Deploy PIM module
        run: az deployment group create --name "BIFROST-PIM-${{ github.run_number }}" --resource-group "${{ needs.validate.outputs.rg_name }}" --template-file modules/pim/main.bicep --parameters @params.json --output table

  pim-not-requested:
    name: 14 - PIM Eligibility | Not requested
    needs: [validate]
    if: always() && inputs.deploy_pim == false
    runs-on: ubuntu-latest
    steps:
      - name: Report PIM not requested
        run: echo "PIM is not included in this deployment execution. No eligibility assignment was created."

  summary:
    name: 12 - Deployment summary
    needs: [resource-group,nsg,vnet,public-ip,nic,vm,windows-public-ip,windows-nic,windows-vm,pim,pim-not-requested]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "BIFROST modular deployment workflow completed."
          echo "Resource stages are listed individually above."
          echo "Review each stage for its deployment result."
